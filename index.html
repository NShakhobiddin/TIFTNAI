<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2545">
  <meta name="description" content="Dekla AI — TIFTN, bojxona to'lovlari va hujjatlarni aniqlovchi aqlli kalkulyator.">
  <title>Dekla AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <!-- App mount point -->
  <div id="app"></div>

  <!-- Design template (rendered by the runtime) -->
  <template id="app-tpl">
<div class="app-root" style="background: {{ screenBg }}">
<!-- status bar -->
      <div style="height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 9px;z-index:20;color: {{ statusColor }}">
        <span style="font-size:15px;font-weight:700;letter-spacing:.2px">9:41</span>
        <span style="display:flex;align-items:center;gap:6px">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"></rect><rect x="5" y="4" width="3" height="8" rx="1"></rect><rect x="10" y="2" width="3" height="10" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.5c2.3 0 4.4.9 6 2.4l1.3-1.4C13.9 1.6 11.3.5 8.5.5S3.1 1.6 1.2 3.5L2.5 4.9c1.6-1.5 3.7-2.4 6-2.4z" opacity=".9"></path><path d="M8.5 6c1.2 0 2.3.5 3.1 1.3l1.3-1.4C11.7 4.7 10.2 4 8.5 4s-3.2.7-4.4 1.9l1.3 1.4C6.2 6.5 7.3 6 8.5 6z" opacity=".9"></path><circle cx="8.5" cy="10" r="1.6"></circle></svg>
          <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="currentColor" stroke-opacity=".5" stroke-width="1.2"></rect><rect x="2.6" y="2.6" width="16" height="7.8" rx="1.6" fill="currentColor"></rect><rect x="23.4" y="4" width="1.6" height="5" rx="1" fill="currentColor" opacity=".5"></rect></svg>
        </span>
      </div>

      <!-- shared logo header -->
      <sc-if value="{{ showLogoHeader }}" hint-placeholder-val="{{ false }}">
        <div style="flex:none;display:flex;align-items:center;padding:2px 16px 12px;position:relative;min-height:34px">
          <button onclick="{{ h.back }}" style="background:#fff;border:1px solid #e9edf4;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;padding:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14284c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          </button>
          <div style="position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none">
            <div style="display:flex;align-items:center;gap:6px">
              <svg width="23" height="23" viewBox="0 0 40 40" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 5h12.5C30.3 5 37 11.2 37 20s-6.7 15-17.5 15H7v-9h11.4c4.7 0 7.6-2.5 7.6-6s-2.9-6-7.6-6H7V5z" fill="#14284c"></path><path d="M10.5 28.5L24 15" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round"></path><path d="M18.8 14.2h6.6v6.6" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
              <span style="font-size:17px;font-weight:800;color:#14284c;letter-spacing:-.2px">Dekla&nbsp;<span style="color:#1ca354">AI</span></span>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- ============ SCROLL AREA ============ -->
      <div class="scr" style="flex:1;overflow-y:auto;position:relative">

      <!-- ============ SPLASH ============ -->
      <sc-if value="{{ isSplash }}" hint-placeholder-val="{{ true }}">
        <div data-screen-label="Splash" onclick="{{ h.login }}" style="position:absolute;inset:0;margin-top:-52px;padding:118px 30px 40px;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:radial-gradient(120% 80% at 50% 18%,#13315c 0%,#0e2545 55%,#0a1c38 100%);overflow:hidden">
          <div style="position:absolute;bottom:90px;left:0;right:0;height:240px;opacity:.5;background:radial-gradient(60% 100% at 50% 100%,rgba(28,163,84,.22),transparent 70%)"></div>
          <svg style="position:absolute;bottom:120px;left:-10%;width:120%;opacity:.35" height="200" viewBox="0 0 400 200" fill="none"><path d="M0 180 Q200 60 400 180" stroke="#2f6dd0" stroke-width="1.2" opacity=".5"></path><path d="M0 200 Q200 90 400 200" stroke="#1ca354" stroke-width="1.2" opacity=".4"></path><circle cx="120" cy="140" r="2.5" fill="#1ca354"></circle><circle cx="300" cy="120" r="2.5" fill="#3f86e8"></circle><circle cx="220" cy="150" r="2" fill="#1ca354"></circle></svg>
          <div style="display:flex;flex-direction:column;align-items:center;gap:22px;opacity:1;z-index:2">
            <svg width="92" height="92" viewBox="0 0 40 40" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 5h12.5C30.3 5 37 11.2 37 20s-6.7 15-17.5 15H7v-9h11.4c4.7 0 7.6-2.5 7.6-6s-2.9-6-7.6-6H7V5z" fill="#ffffff"></path><path d="M10.5 28.5L24 15" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round"></path><path d="M18.8 14.2h6.6v6.6" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>
            <div style="font-size:38px;font-weight:800;color:#fff;letter-spacing:-.5px;white-space:nowrap">Dekla <span style="color:#2fc36a">AI</span></div>
            <div style="font-size:15px;line-height:1.6;color:#b9c8e0;text-align:center;max-width:260px;font-weight:500">TIFTN, bojxona to'lovlari va hujjatlarni aniqlovchi aqlli kalkulyator</div>
          </div>
          <div style="margin-top:auto;display:flex;gap:11px;z-index:2;opacity:1">
            <div style="display:flex;flex-direction:column;align-items:center;gap:7px;width:70px"><div style="width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7fe0a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg></div><span style="font-size:10.5px;color:#9fb1cc;text-align:center;line-height:1.3">Aniq hisob-kitob</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:7px;width:70px"><div style="width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#7fe0a3"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"></path></svg></div><span style="font-size:10.5px;color:#9fb1cc;text-align:center;line-height:1.3">Tezkor natija</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:7px;width:70px"><div style="width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7fe0a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg></div><span style="font-size:10.5px;color:#9fb1cc;text-align:center;line-height:1.3">Ishonchli ma'lumotlar</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:7px;width:70px"><div style="width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7fe0a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></div><span style="font-size:10.5px;color:#9fb1cc;text-align:center;line-height:1.3">24/7 buyurtma</span></div>
          </div>
          <div style="margin-top:24px;font-size:12px;color:#6f86a8;z-index:2">Davom etish uchun bosing</div>
        </div>
      </sc-if>

      <!-- ============ LOGIN ============ -->
      <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
        <div data-screen-label="Kirish" style="padding:18px 22px 30px;opacity:1">
          <div style="display:flex;justify-content:center;margin:14px 0 30px">
            <div style="display:flex;align-items:center;gap:7px"><svg width="28" height="28" viewBox="0 0 40 40" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 5h12.5C30.3 5 37 11.2 37 20s-6.7 15-17.5 15H7v-9h11.4c4.7 0 7.6-2.5 7.6-6s-2.9-6-7.6-6H7V5z" fill="#14284c"></path><path d="M10.5 28.5L24 15" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round"></path><path d="M18.8 14.2h6.6v6.6" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg><span style="font-size:21px;font-weight:800;color:#14284c;white-space:nowrap">Dekla <span style="color:#1ca354">AI</span></span></div>
          </div>
          <h1 style="font-size:23px;font-weight:700;color:#14284c;margin:0 0 6px">Kirish</h1>
          <p style="font-size:14px;color:#7c879b;margin:0 0 26px;line-height:1.5">Hisobingizga kirish uchun telefon raqamingizni kiriting</p>
          <div style="font-size:13px;font-weight:600;color:#3a455c;margin:0 0 9px">Telefon raqami</div>
          <div style="display:flex;gap:9px;margin-bottom:18px">
            <div style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #dde3ee;border-radius:13px;padding:0 13px;font-size:15px;font-weight:600;color:#14284c"><span style="font-size:17px">🇺🇿</span> +998 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9aa4b6" stroke-width="2.5"><path d="M6 9l6 6 6-6"></path></svg></div>
            <input placeholder="90 123 45 67" style="flex:1;background:#fff;border:1px solid #dde3ee;border-radius:13px;padding:15px;font-size:16px;color:#14284c;font-family:inherit;outline:none;letter-spacing:.5px">
          </div>
          <button onclick="{{ h.sms }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#14284c;color:#fff;border:none;border-radius:15px;padding:16px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:18px">SMS kod olish <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg></button>
          <div style="display:flex;gap:11px;background:#eef3fb;border:1px solid #dfe9f7;border-radius:15px;padding:15px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f6dd0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <div><div style="font-size:13.5px;font-weight:700;color:#14284c;margin-bottom:3px">Xavfsiz va ishonchli</div><div style="font-size:12.5px;color:#6a7689;line-height:1.5">Ma'lumotlaringiz shifrlangan holda saqlanadi va hech kim bilan bo'lishilmaydi.</div></div>
          </div>
          <p style="font-size:12px;color:#8b94a6;text-align:center;line-height:1.6;margin:26px 8px 0">Davom etish orqali siz <span style="color:#1ca354;font-weight:600">Foydalanish shartlari</span> va <span style="color:#1ca354;font-weight:600">Maxfiylik siyosatiga</span> rozilik bildirasiz.</p>
        </div>
      </sc-if>

      <!-- ============ SMS ============ -->
      <sc-if value="{{ isSms }}" hint-placeholder-val="{{ false }}">
        <div data-screen-label="SMS tasdiqlash" style="padding:6px 22px 30px;opacity:1;position:relative">
          <button onclick="{{ h.back }}" style="position:absolute;left:16px;top:2px;background:#fff;border:1px solid #e9edf4;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14284c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <div style="display:flex;justify-content:center;margin:10px 0 28px"><div style="display:flex;align-items:center;gap:7px"><svg width="26" height="26" viewBox="0 0 40 40" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 5h12.5C30.3 5 37 11.2 37 20s-6.7 15-17.5 15H7v-9h11.4c4.7 0 7.6-2.5 7.6-6s-2.9-6-7.6-6H7V5z" fill="#14284c"></path><path d="M10.5 28.5L24 15" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round"></path><path d="M18.8 14.2h6.6v6.6" stroke="#1ca354" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg><span style="font-size:20px;font-weight:800;color:#14284c;white-space:nowrap">Dekla <span style="color:#1ca354">AI</span></span></div></div>
          <h1 style="font-size:22px;font-weight:700;color:#14284c;margin:0 0 8px;text-align:center">SMS kodni kiriting</h1>
          <p style="font-size:13.5px;color:#7c879b;margin:0 auto 28px;line-height:1.55;text-align:center;max-width:270px">+998 90 123 45 67 raqamiga yuborilgan 6 xonali kodni kiriting</p>
          <div style="display:flex;gap:9px;justify-content:center;margin-bottom:24px">
            <div style="width:46px;height:56px;border:1.5px solid #dde3ee;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#14284c;background:#fff">1</div>
            <div style="width:46px;height:56px;border:1.5px solid #dde3ee;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#14284c;background:#fff">2</div>
            <div style="width:46px;height:56px;border:1.5px solid #dde3ee;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#14284c;background:#fff">3</div>
            <div style="width:46px;height:56px;border:1.5px solid #dde3ee;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#14284c;background:#fff">4</div>
            <div style="width:46px;height:56px;border:1.5px solid #dde3ee;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#14284c;background:#fff">5</div>
            <div style="width:46px;height:56px;border:1.8px solid #1ca354;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;color:#14284c;background:#f3fbf6">6</div>
          </div>
          <p style="font-size:13.5px;color:#7c879b;text-align:center;margin:0 0 22px">Qayta yuborish: <span style="color:#1ca354;font-weight:700">00:45</span></p>
          <button onclick="{{ h.onb }}" style="width:100%;background:#14284c;color:#fff;border:none;border-radius:15px;padding:16px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer">Tasdiqlash</button>
          <p style="font-size:13px;color:#7c879b;text-align:center;margin:20px 0 0">Kod kelmadimi? <span style="color:#1ca354;font-weight:700">Qayta yuborish</span></p>
        </div>
      </sc-if>

      <!-- ============ ONBOARDING ============ -->
      <sc-if value="{{ isOnb }}" hint-placeholder-val="{{ false }}">
        <div data-screen-label="Onboarding" style="padding:8px 24px 30px;opacity:1;min-height:100%;display:flex;flex-direction:column">
          <div style="display:flex;justify-content:flex-end"><button onclick="{{ h.dash }}" style="background:none;border:none;font-size:13px;color:#8b94a6;font-weight:600;font-family:inherit;cursor:pointer">O'tkazib yuborish</button></div>
          <h1 style="font-size:24px;font-weight:800;color:#14284c;margin:14px 0 26px;line-height:1.3;letter-spacing:-.3px">Dekla AI bilan<br>3 qadamda hisoblang</h1>
          <div style="background:linear-gradient(160deg,#eef3fb,#e3ecf8);border:1px solid #dfe9f7;border-radius:22px;height:230px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:30px">
            <sc-if value="{{ onb0 }}" hint-placeholder-val="{{ true }}"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#9bb4d6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"></path><path d="M3.3 7L12 12l8.7-5M12 22V12"></path></svg></sc-if>
            <sc-if value="{{ onb1 }}" hint-placeholder-val="{{ false }}"><div style="text-align:center"><svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#9bb4d6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg><div style="margin-top:10px;font-size:18px;font-weight:800;color:#1ca354;font-family:monospace">8471.30.000 0</div></div></sc-if>
            <sc-if value="{{ onb2 }}" hint-placeholder-val="{{ false }}"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#9bb4d6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6M9 13l2 2 4-4"></path></svg></sc-if>
            <div style="position:absolute;bottom:14px;right:14px;width:40px;height:40px;border-radius:50%;background:#1ca354;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
          </div>
          <div style="display:flex;justify-content:center;margin-bottom:14px"><div style="width:34px;height:34px;border-radius:50%;background:#14284c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px"><sc-if value="{{ onb0 }}" hint-placeholder-val="{{ true }}">1</sc-if><sc-if value="{{ onb1 }}" hint-placeholder-val="{{ false }}">2</sc-if><sc-if value="{{ onb2 }}" hint-placeholder-val="{{ false }}">3</sc-if></div></div>
          <sc-if value="{{ onb0 }}" hint-placeholder-val="{{ true }}"><div style="text-align:center;margin-bottom:6px"><div style="font-size:17px;font-weight:700;color:#14284c;margin-bottom:8px">Tovarni kiriting</div><div style="font-size:13.5px;color:#7c879b;line-height:1.55;max-width:280px;margin:0 auto">Tovar nomi, tavsifi yoki HS kodini kiriting. Sun'iy intellekt tavsifni tahlil qiladi.</div></div></sc-if>
          <sc-if value="{{ onb1 }}" hint-placeholder-val="{{ false }}"><div style="text-align:center;margin-bottom:6px"><div style="font-size:17px;font-weight:700;color:#14284c;margin-bottom:8px">TIFTN kodni aniqlang</div><div style="font-size:13.5px;color:#7c879b;line-height:1.55;max-width:280px;margin:0 auto">Sun'iy intellekt eng mos TIFTN kodini aniqlaydi va asoslab beradi.</div></div></sc-if>
          <sc-if value="{{ onb2 }}" hint-placeholder-val="{{ false }}"><div style="text-align:center;margin-bottom:6px"><div style="font-size:17px;font-weight:700;color:#14284c;margin-bottom:8px">To'lov va hujjatlarni ko'ring</div><div style="font-size:13.5px;color:#7c879b;line-height:1.55;max-width:280px;margin:0 auto">Bojxona to'lovlari, ruxsatnomalar va xavf darajasini bir joyda ko'ring.</div></div></sc-if>
          <div style="display:flex;justify-content:center;gap:7px;margin:18px 0 22px">
            <div style="width:22px;height:7px;border-radius:4px;background: {{ onbDot0 }}"></div>
            <div style="width:7px;height:7px;border-radius:4px;background: {{ onbDot1 }}"></div>
            <div style="width:7px;height:7px;border-radius:4px;background: {{ onbDot2 }}"></div>
          </div>
          <button onclick="{{ h.nextOnb }}" style="margin-top:auto;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#14284c;color:#fff;border:none;border-radius:15px;padding:16px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer">{{ onbBtn }} <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        </div>
      </sc-if>

      <!-- ============ DASHBOARD ============ -->
      <sc-if value="{{ isDash }}" hint-placeholder-val="{{ false }}">
