name = "dekla-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Optional: override the default model (default: claude-opus-4-8).
# For cheaper / faster runs you can use:
# CLAUDE_MODEL = "claude-haiku-4-5"
# Optional but recommended: lock the proxy to your site origin, e.g.
# ALLOWED_ORIGIN = "https://nshakhobiddin.github.io"

# ANTHROPIC_API_KEY is a SECRET — do NOT put it here.
# Set it with:  npx wrangler secret put ANTHROPIC_API_KEY
